name: Build Sonoma14.4 no-powersave

on:
  push:
    branches: ['nops-2.3.0']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-nops-2.3.0
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK

      - name: Verify power save is disabled in source
        run: |
          set -euo pipefail
          echo "--- assignments to *_POWER_SAVE_ENA_MSK (should be none) ---"
          if grep -nE 'flags[[:space:]]*=[[:space:]]*htole16\(IWM_(DEVICE_)?POWER_FLAGS_POWER_SAVE_ENA_MSK\)' itlwm/hal_iwm/power.cpp; then
            echo "ERROR: power save still enabled"
            exit 1
          fi
          echo "OK: no power-save flag assignments left"

      - name: Build AirportItlwm-Sonoma14.4
        run: |
          set -euo pipefail
          mkdir -p logs
          set +e
          xcodebuild -project itlwm.xcodeproj \
            -target "AirportItlwm-Sonoma14.4" \
            -configuration Release -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > logs/build.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "BUILD FAILED ($rc) -- last 120 lines:"
            tail -120 logs/build.log
            exit "$rc"
          fi
          echo "BUILD OK"
          grep -E "MODULE_VERSION|CFBundleVersion" logs/build.log | tail -3 || true
          tail -8 logs/build.log

      - name: Package kext
        run: |
          set -euo pipefail
          KEXT=$(find build -type d -name "AirportItlwm.kext" | head -1)
          if [ -z "$KEXT" ]; then
            echo "kext not found; tree:"
            find build -maxdepth 6 -name "*.kext" | head -20
            exit 1
          fi
          echo "Found: $KEXT"
          echo "  version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KEXT/Contents/Info.plist" 2>/dev/null)"
          echo "  size:    $(stat -f%z "$KEXT/Contents/MacOS/AirportItlwm")"
          mkdir -p out
          ditto -c -k --keepParent "$KEXT" out/AirportItlwm-Sonoma14.4-nops.zip
          ls -lh out/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sonoma14.4-nops
          path: out/*.zip
          retention-days: 30

      - name: Publish back to branch
        if: always()
        run: |
          set -e
          mkdir -p artifacts
          cp logs/build.log artifacts/build.log 2>/dev/null || true
          [ -f out/AirportItlwm-Sonoma14.4-nops.zip ] && cp out/AirportItlwm-Sonoma14.4-nops.zip artifacts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "nothing to publish"
          else
            git commit -m "ci: no-powersave build result [skip ci]"
            git push origin HEAD:nops-2.3.0
          fi
